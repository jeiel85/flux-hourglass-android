<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>Hourglass — particle-physics timer</title>
    <meta name="description" content="A timer you can watch: thousands of grains fall and pile up under real gravity. Sand, water, fire or LED. Runs in your browser, works offline, no tracking." />
    <link rel="canonical" href="https://jeiel85.github.io/flux-hourglass-android/app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flux Hourglass" />
    <meta property="og:title" content="Flux Hourglass — a timer you can watch" />
    <meta property="og:description" content="Thousands of grains fall and pile up under real gravity. Pick sand, water, fire or LED and start a timer in your browser." />
    <meta property="og:image" content="https://jeiel85.github.io/flux-hourglass-android/assets/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://jeiel85.github.io/flux-hourglass-android/app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" id="favicon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hourglass" />
    <link rel="stylesheet" href="../css/app.css" />
    <script type="module" src="../js/app.js"></script>
  </head>
  <body>
    <main id="setup" class="screen setup" aria-label="Set a timer">
      <header class="top">
        <button class="corner" id="btn-settings" type="button" aria-haspopup="dialog" aria-label="Physics settings">
          <span class="sp">Sett</span>
        </button>
        <h1 class="title"><span class="sp">Hourglass</span></h1>
        <button class="corner" id="btn-share" type="button" aria-label="Share this timer">
          <span class="sp">Share</span>
        </button>
      </header>

      <div class="modes-wrap">
        <div class="modes" id="modes" role="radiogroup" aria-label="What falls"></div>
      </div>

      <div class="presets" id="presets" aria-label="Quick presets">
        <button type="button" data-secs="60">1m</button>
        <button type="button" data-secs="180">3m</button>
        <button type="button" data-secs="300">5m</button>
        <button type="button" data-secs="600">10m</button>
        <button type="button" data-secs="1500">25m</button>
        <button type="button" data-secs="3600">1h</button>
      </div>

      <div class="picker" id="picker">
        <div class="col" data-unit="h" data-max="99" data-name="Hours">
          <span class="lbl sp" aria-hidden="true">Hr</span>
          <button type="button" class="arrow up" tabindex="-1" aria-label="More hours"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14l5-5 5 5" /></svg></button>
          <div class="num" role="spinbutton" tabindex="0" aria-label="Hours" aria-valuemin="0" aria-valuemax="99">00</div>
          <button type="button" class="arrow down" tabindex="-1" aria-label="Fewer hours"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" /></svg></button>
        </div>
        <span class="colon" aria-hidden="true">:</span>
        <div class="col" data-unit="m" data-max="59" data-name="Minutes">
          <span class="lbl sp" aria-hidden="true">Min</span>
          <button type="button" class="arrow up" tabindex="-1" aria-label="More minutes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14l5-5 5 5" /></svg></button>
          <div class="num" role="spinbutton" tabindex="0" aria-label="Minutes" aria-valuemin="0" aria-valuemax="59">01</div>
          <button type="button" class="arrow down" tabindex="-1" aria-label="Fewer minutes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" /></svg></button>
        </div>
        <span class="colon" aria-hidden="true">:</span>
        <div class="col" data-unit="s" data-max="59" data-name="Seconds">
          <span class="lbl sp" aria-hidden="true">Sec</span>
          <button type="button" class="arrow up" tabindex="-1" aria-label="More seconds"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14l5-5 5 5" /></svg></button>
          <div class="num" role="spinbutton" tabindex="0" aria-label="Seconds" aria-valuemin="0" aria-valuemax="59">00</div>
          <button type="button" class="arrow down" tabindex="-1" aria-label="Fewer seconds"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" /></svg></button>
        </div>
      </div>

      <button class="start" id="btn-start" type="button"><span class="sp">Start</span></button>
    </main>

    <section id="run" class="screen run" hidden aria-label="Timer running">
      <canvas id="stage" aria-hidden="true"></canvas>
      <p class="hint" id="hint" aria-hidden="true"></p>
      <div class="reveal" id="reveal" aria-hidden="true">
        <span class="lbl sp">Remaining</span>
        <span class="time" id="reveal-time">00 : 00 : 00</span>
      </div>
      <p class="sr-only" id="sr-time" aria-live="off"></p>
      <div class="controls">
        <button class="pill" id="btn-pause" type="button"><span class="sp">Pause</span></button>
        <button class="pill" id="btn-sound" type="button" aria-pressed="false"><span class="sp">Mute</span></button>
        <button class="pill" id="btn-reset" type="button"><span class="sp">Reset</span></button>
      </div>
    </section>

    <section id="paused" class="screen paused" hidden aria-label="Paused">
      <span class="lbl sp">Paused</span>
      <div class="paused-mid">
        <span class="time" id="paused-time">00 : 00 : 00</span>
        <span class="pct sp" id="paused-pct">0 % remaining</span>
      </div>
      <div class="paused-actions">
        <button class="line-btn small" id="btn-paused-reset" type="button"><span class="sp">Reset</span></button>
        <button class="line-btn" id="btn-resume" type="button"><span class="sp">Resume</span></button>
      </div>
    </section>

    <section id="done" class="screen done" hidden aria-label="Time is up">
      <div class="done-inner">
        <h2 class="end sp">End</h2>
        <p class="sub sp">Time is fulfilled</p>
        <button class="line-btn" id="btn-again" type="button"><span class="sp">Again</span></button>
      </div>
    </section>

    <dialog id="settings" class="sheet" aria-labelledby="settings-title">
      <form method="dialog" class="sheet-body">
        <h2 id="settings-title" class="sheet-title sp">Sandbox physics</h2>
        <label class="slider">
          <span class="row"><span class="name sp">Gravity sensitivity</span><output data-for="gravity">1.0x</output></span>
          <input type="range" name="gravity" min="0.3" max="2.5" step="0.1" value="1" />
        </label>
        <label class="slider">
          <span class="row"><span class="name sp">Particle size</span><output data-for="size">1.0x</output></span>
          <input type="range" name="size" min="0.6" max="2.2" step="0.1" value="1" />
        </label>
        <label class="slider">
          <span class="row"><span class="name sp">Particle density</span><output data-for="density">1.0x</output></span>
          <input type="range" name="density" min="0.5" max="2" step="0.1" value="1" />
        </label>
        <div class="level" id="level-row" hidden>
          <button type="button" class="line-btn small" id="btn-level"><span class="sp">Set current tilt as level</span></button>
        </div>
        <button class="line-btn done-btn" value="done"><span class="sp">Done</span></button>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <noscript><p class="noscript">Hourglass needs JavaScript to run the particle simulation.</p></noscript>
  </body>
</html>
