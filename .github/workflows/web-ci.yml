name: Web CI

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'tests/web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/web/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: Web unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: node --test "tests/web/*.test.mjs"
