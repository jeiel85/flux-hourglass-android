# Play용 AAB를 CI에서 빌드해 Play 트랙(비공개 테스트 alpha)에 올립니다(RELEASE.md "3. Play Console 업로드").
#
# - 태그 vX.Y.Z가 올라오면 그 버전을 올립니다. 같은 태그로 release.yml(GitHub Release, APK만)도 따로 돕니다 —
#   이 워크플로는 Play만, release.yml은 GitHub만 맡으므로 같은 산출물이 두 번 올라가지 않습니다.
# - Actions 화면에서 손으로 돌릴 수도 있습니다(version 입력). dry_run을 켜면 빌드·서명 확인·트랙 조회까지만 하고 올리지 않습니다.
# 비밀값은 GitHub 환경 'play'에만 있고, 그 환경은 jeiel85의 승인을 받아야 실행됩니다(main 브랜치·v* 태그만).
name: Play release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (X.Y.Z, play_store/release_notes/vX.Y.Z.txt가 있어야 함)'
        required: true
      dry_run:
        description: '올리지 않고 빌드·서명 확인·트랙 조회만'
        type: boolean
        default: false

concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  play:
    runs-on: ubuntu-latest
    environment: play
    timeout-minutes: 40
    env:
      PACKAGE: com.flux.hourglass
      # 올릴 트랙(공백 구분). 첫 트랙에 AAB를 올리고, 나머지에는 같은 versionCode를 붙입니다.
      TRACKS: alpha
      # Play 업로드 키 인증서 SHA-256(.keystore/flux-hourglass-play-upload.jks, 2026-11-28 재설정 요청 — RELEASE.md §3).
      # GitHub Release용 RELEASE_* 키와 다른 Play 전용 키입니다. 키스토어가 이와 다르면 빌드 전에 멈춥니다.
      UPLOAD_CERT_SHA256: 'F3:EC:5D:99:3F:B4:F1:BB:70:CE:95:AC:25:53:6E:08:59:75:3C:BB:FD:F0:83:1B:DC:57:FC:11:78:C3:7F:3B'
      KEYSTORE_FILE: ${{ github.workspace }}/.keystore/play-upload.jks
    steps:
      - uses: actions/checkout@v4

      - name: 버전 정하기
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY: ${{ inputs.dry_run }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then VER="${GITHUB_REF_NAME#v}"; else VER="$INPUT_VERSION"; fi
          [[ "$VER" =~ ^[0-9]{1,4}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] || { echo "::error::버전은 X.Y.Z여야 합니다: $VER"; exit 1; }
          NOTES="play_store/release_notes/v$VER.txt"
          [ -f "$NOTES" ] || { echo "::error::$NOTES 가 없습니다"; exit 1; }
          IFS=. read -r MA MI PA <<<"$VER"
          # app/build.gradle.kts의 versionCode 식과 같습니다.
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$((10#$MA * 1000000 + 10#$MI * 1000 + 10#$PA))" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          echo "dry=${DRY:-false}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 서명 키 놓기·지문 확인
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
        run: |
          [ -n "$UPLOAD_CERT_SHA256" ] || { echo "::error::UPLOAD_CERT_SHA256 이 비어 있습니다"; exit 1; }
          mkdir -p "$(dirname "$KEYSTORE_FILE")"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_FILE"
          [ -s "$KEYSTORE_FILE" ] || { echo "::error::PLAY_UPLOAD_KEYSTORE_B64 가 비어 있습니다"; exit 1; }
          SHA=$(keytool -J-Duser.language=en -list -v -keystore "$KEYSTORE_FILE" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" \
                | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n1 | tr 'a-f' 'A-F')
          [ "$SHA" = "$UPLOAD_CERT_SHA256" ] || { echo "::error::키스토어 인증서($SHA)가 Play 업로드 키와 다릅니다"; exit 1; }
          echo "업로드 키 지문 일치: $SHA"
          base64 -d debug.keystore.base64 > debug.keystore

      - name: 시험
        run: ./gradlew test

      - name: AAB 빌드
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_FILE }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          ./gradlew bundleRelease -PVERSION_NAME="$VER"
          AAB=app/build/outputs/bundle/release/app-release.aab
          [ -s "$AAB" ] || { echo "::error::AAB가 없습니다"; exit 1; }
          echo "AAB=$AAB" >> "$GITHUB_ENV"

      - name: 출시 노트 나누기(ko-KR·en-US)
        env:
          NOTES: ${{ steps.ver.outputs.notes }}
        run: |
          mkdir -p dist
          for L in ko-KR en-US; do
            awk -v o="<$L>" -v c="</$L>" '{sub(/\r$/, "")} $0==o {on=1; next} $0==c {on=0} on' "$NOTES" > "dist/notes-$L.txt"
            [ -s "dist/notes-$L.txt" ] || { echo "::error::$NOTES 에 <$L> 블록이 없습니다"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: flux-hourglass-play-${{ steps.ver.outputs.version }}
          path: |
            ${{ env.AAB }}
            dist/notes-*.txt
          retention-days: 30

      - name: Play 트랙 상태(올리기 전)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -ShowTracks

      - name: Play 트랙에 올리기
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VER: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
          DRY: ${{ steps.ver.outputs.dry }}
        run: |
          DRYFLAG=(); [ "$DRY" = true ] && DRYFLAG=(-DryRun)
          NOTES=(-NotesKoFile dist/notes-ko-KR.txt -NotesEnFile dist/notes-en-US.txt)
          FIRST=1
          for T in $TRACKS; do
            if [ "$FIRST" = 1 ]; then
              pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -Track "$T" -AabPath "$AAB" \
                -ExpectedUploadCertSha256 "$UPLOAD_CERT_SHA256" -ReleaseName "$CODE ($VER)" "${NOTES[@]}" "${DRYFLAG[@]}"
              FIRST=0
            else
              pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -Track "$T" -ExpectedVersionCode "$CODE" \
                -ReleaseName "$CODE ($VER)" "${NOTES[@]}" "${DRYFLAG[@]}"
            fi
          done

      - name: Play 트랙 상태(올린 뒤)
        if: steps.ver.outputs.dry != 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -ShowTracks

      - name: 키 지우기
        if: always()
        run: rm -f "$KEYSTORE_FILE" debug.keystore
